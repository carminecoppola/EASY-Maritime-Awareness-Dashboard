{% extends "base.html" %}

{% block content %}
  <section class="live-page">
    <div class="live-statusbar" role="status" aria-label="Stato live">
      <div class="live-statusbar-group">
        <div class="live-status-pill" id="status-pill-rgb-left">
          <span class="live-status-dot" id="rgb_left_dot" aria-hidden="true"></span>
          <span class="live-status-label">RGB-L:</span>
          <strong id="rgb_left_status">LIVE 10fps</strong>
        </div>
        <div class="live-status-pill" id="status-pill-thermal">
          <span class="live-status-dot" id="thermal_dot" aria-hidden="true"></span>
          <span class="live-status-label">Thermal:</span>
          <strong id="thermal_status">REALE</strong>
        </div>
        <div class="live-status-pill" id="status-pill-rgb-right">
          <span class="live-status-dot" id="rgb_right_dot" aria-hidden="true"></span>
          <span class="live-status-label">RGB-R:</span>
          <strong id="rgb_right_status">LIVE 10fps</strong>
        </div>
      </div>
      <div class="live-statusbar-actions">
        <div class="live-status-pill live-status-pill-ai" id="status-pill-ai">
          <span class="live-status-dot live-status-dot-ai" id="ai_status_dot" aria-hidden="true"></span>
          <span class="live-status-label">AI ·</span>
          <strong id="ai_status_compact">—</strong>
        </div>
        <button class="btn btn-secondary btn-small" id="live-snapshot-button" type="button">Snapshot</button>
        <button class="btn btn-primary btn-small" id="live-record-button" type="button">Registra</button>
      </div>
    </div>

    <section class="live-grid">
      <article class="panel live-feed-card" data-feed="rgb_left">
        <div class="live-feed-head">
          <span class="live-feed-name">RGB LEFT</span>
          <span class="badge badge-muted" id="rgb_left_state">Loading</span>
        </div>
        <div class="live-feed-body">
          <img
            class="feed-image live-feed-image"
            data-feed-image="rgb_left"
            {% if not request.args.get("lite") %}src="/video/rgb_left"{% endif %}
            alt="RGB left live preview"
          >
          <div class="live-offline-card" id="rgb_left_offline" hidden>
            <svg class="live-offline-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h2.8l1.6-2h3.2l1.6 2H18a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2Z"></path>
              <path d="M8 12.5a4 4 0 0 1 6.2-3.3"></path>
              <path d="M13.8 14.8a4 4 0 0 1-5.6 0"></path>
            </svg>
            <strong id="rgb_left_device_name">Arducam UC-517 LEFT</strong>
          </div>
        </div>
        <div class="live-feed-foot">
          <span class="live-feed-fps" id="rgb_left_fps">--</span>
          <span class="live-feed-time" id="rgb_left_last">--</span>
        </div>
      </article>

      <article class="panel live-feed-card live-feed-card-thermal" data-feed="thermal">
        <div class="live-feed-head">
          <span class="live-feed-name">THERMAL</span>
          <span class="badge badge-muted" id="thermal_state">Loading</span>
        </div>
        <div class="live-feed-body">
          <img
            class="feed-image live-feed-image thermal-image"
            id="thermal-frame"
            {% if not request.args.get("lite") %}src="/thermal/frame"{% endif %}
            alt="Thermal preview"
          >
          <div class="live-offline-card" id="thermal_offline" hidden>
            <svg class="live-offline-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 4.5a2 2 0 0 1 4 0v7.1a4.5 4.5 0 1 1-4 0Z"></path>
              <path d="M12 9.8v4.7"></path>
              <path d="M12 14.5c-1.3 0-2.4 1-2.4 2.3s1.1 2.2 2.4 2.2 2.4-1 2.4-2.2S13.3 14.5 12 14.5Z"></path>
            </svg>
            <strong id="thermal_device_name">FLIR Lepton</strong>
          </div>
        </div>
        <div class="live-feed-foot">
          <span class="live-feed-fps" id="thermal_fps">--</span>
          <span class="live-feed-time" id="thermal_last">--</span>
        </div>
      </article>

      <article class="panel live-feed-card" data-feed="rgb_right">
        <div class="live-feed-head">
          <span class="live-feed-name">RGB RIGHT</span>
          <span class="badge badge-muted" id="rgb_right_state">Loading</span>
        </div>
        <div class="live-feed-body">
          <img
            class="feed-image live-feed-image"
            data-feed-image="rgb_right"
            {% if not request.args.get("lite") %}src="/video/rgb_right"{% endif %}
            alt="RGB right live preview"
          >
          <div class="live-offline-card" id="rgb_right_offline" hidden>
            <svg class="live-offline-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h2.8l1.6-2h3.2l1.6 2H18a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2Z"></path>
              <path d="M8 12.5a4 4 0 0 1 6.2-3.3"></path>
              <path d="M13.8 14.8a4 4 0 0 1-5.6 0"></path>
            </svg>
            <strong id="rgb_right_device_name">Arducam UC-517 RIGHT</strong>
          </div>
        </div>
        <div class="live-feed-foot">
          <span class="live-feed-fps" id="rgb_right_fps">--</span>
          <span class="live-feed-time" id="rgb_right_last">--</span>
        </div>
      </article>
    </section>
  </section>
{% endblock %}
