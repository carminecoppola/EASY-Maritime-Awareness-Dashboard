{% extends "base.html" %}

{% block header_meta %}{% endblock %}

{% block content %}
  <section class="system-page">
    <section class="system-resources panel">
      <div class="system-metric-row">
        <article class="metric system-metric">
          <span>CPU</span>
          <strong id="cpu-percent" class="system-metric-value">--</strong>
        </article>
        <article class="metric system-metric">
          <span>RAM</span>
          <strong id="ram-percent" class="system-metric-value">--</strong>
        </article>
        <article class="metric system-metric">
          <span>Disco</span>
          <strong id="disk-percent" class="system-metric-value">--</strong>
        </article>
        <article class="metric system-metric">
          <span>Temp</span>
          <strong id="cpu-temp" class="system-metric-value">--</strong>
        </article>
        <article class="metric system-metric">
          <span>Uptime</span>
          <strong id="uptime" class="system-metric-value">--</strong>
        </article>
      </div>
    </section>

    <section class="system-devices panel">
      <span class="badge badge-muted system-device-count" id="system-device-count">0/3</span>
      <div class="system-device-list" id="device-list"></div>
    </section>

    <section class="system-errors panel">
      <a class="panel-link panel-link-icon" href="/snapshots?severity=error">
        <span>Vedi tutti nel log →</span>
      </a>
      <div class="system-errors-empty" id="system-errors-empty" hidden>
        <svg class="system-empty-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12.5a8 8 0 1 1-4.3-7.1"></path>
          <path d="m10.2 12.2 2.1 2.1 4.1-4.9"></path>
        </svg>
        <span>Nessun errore recente</span>
      </div>
      <div class="system-error-list" id="recent-errors-list"></div>
    </section>
  </section>
{% endblock %}
