{% extends "base.html" %}

{% block header_meta %}{% endblock %}

{% block content %}
  <section class="log-page">
    <section class="log-count-bar" aria-label="Filtri rapidi log">
      <button type="button" class="log-count-chip is-active" data-log-severity="all">
        <span>Tutti</span><strong id="log-count-all">0</strong>
      </button>
      <button type="button" class="log-count-chip" data-log-severity="error">
        <span>Errori</span><strong id="log-count-error">0</strong>
      </button>
      <button type="button" class="log-count-chip" data-log-severity="info">
        <span>Informazioni</span><strong id="log-count-info">0</strong>
      </button>
      <button type="button" class="log-count-chip" data-log-severity="detection">
        <span>Rilevazioni</span><strong id="log-count-detection">0</strong>
      </button>
      <button type="button" class="log-count-chip" data-log-severity="warning">
        <span>Avvisi</span><strong id="log-count-warning">0</strong>
      </button>
      <button class="btn btn-ghost btn-small btn-icon log-export-button" id="button-log-export-csv" type="button">
        <svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2.5v7"></path>
          <path d="m5.2 7.8 2.8 2.8 2.8-2.8"></path>
          <path d="M3 13.5h10"></path>
        </svg>
        <span>Esporta CSV</span>
      </button>
    </section>

    <section class="log-toolbar panel">
      <label class="log-search">
        <span>Ricerca</span>
        <input type="search" id="log-search-input" placeholder="Filtra per sorgente, messaggio...">
      </label>
      <label class="log-select">
        <span>Sorgente</span>
        <select id="log-source-filter">
          <option value="all">Tutte</option>
          <option value="thermal">THERMAL</option>
          <option value="rgb_left">RGB LEFT</option>
          <option value="rgb_right">RGB RIGHT</option>
          <option value="system">SISTEMA</option>
          <option value="uc512">UC512</option>
        </select>
      </label>
    </section>

    <section class="log-list-panel panel">
      <div class="log-list" id="log-list"></div>
      <div class="log-empty-state" id="log-empty-state" hidden>
        Nessun evento corrisponde ai filtri attivi.
      </div>
      <button class="btn btn-secondary btn-small log-load-more" id="button-log-load-more" type="button">Carica altri 100</button>
    </section>
  </section>
{% endblock %}
