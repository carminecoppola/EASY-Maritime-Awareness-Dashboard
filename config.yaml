app:
  host: 0.0.0.0
  port: 5000
  debug: false

rgb:
  enabled: true
  mode: split_stereo
  camera_index: 0
  width: 1280
  height: 480
  fps: 10
  quality: 85
  crop_ratio: 0.5

thermal:
  enabled: true
  mode: real
  threshold_celsius: 35.0
  delta_threshold: 8.0
  device: auto
  input_format: y16
  video_size: 160x120

events:
  max_events: 200

# Leave empty for the default LAN-only trust model. Set a value here (or the
# EASY_DASHBOARD_TOKEN env var, which takes precedence) to require an
# X-EASY-Token header on state-changing requests -- useful for a demo on a
# network with untrusted peers.
security:
  shared_token: ""
