# Dashboard configuration. Missing keys fall back to easy_dashboard/constants.py
# (DEFAULT_CONFIG). Only simple nested "key: value" pairs are supported (see
# easy_dashboard/config.py): no lists and no multi-line values.
#
#   app      Flask host and port (the launcher and the systemd unit expect 5000)
#   rgb      the stereo camera: one process, 1280x480 side by side, cropped into two views
#   thermal  the PureThermal / FLIR Lepton sensor (mock mode simulates it without hardware)
#   events   how many events the in-memory log keeps
#   security optional shared token for state-changing requests

app:
  host: 0.0.0.0
  port: 5000
  debug: false

rgb:
  enabled: true
  mode: split_stereo
  camera_index: 0
  width: 1280
  height: 480
  fps: 10
  quality: 85
  crop_ratio: 0.5

thermal:
  enabled: true
  mode: real
  # The persistent Y16 worker passed the 30-minute recovery test and the
  # two-hour RGB+thermal endurance gate on the target Raspberry.
  capture_mode: continuous
  stream_fps: 9
  preview_fps: 5
  threshold_celsius: 35.0
  delta_threshold: 8.0
  device: auto
  input_format: y16
  video_size: 160x120

events:
  max_events: 200

# Leave empty for the default LAN-only trust model. Set a value here (or the
# EASY_DASHBOARD_TOKEN env var, which takes precedence) to require an
# X-EASY-Token header on state-changing requests -- useful for a demo on a
# network with untrusted peers.
security:
  shared_token: ""
