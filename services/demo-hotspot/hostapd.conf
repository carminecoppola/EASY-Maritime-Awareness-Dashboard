# Demo hotspot for EASY, applied to wlan0 only when scripts/demo_hotspot.sh
# enable is run with physical access to the Pi. Not active by default.
#
# CHANGE THE PASSPHRASE BELOW before using this at a conference -- anyone in
# range who knows it can join the dashboard's network.

interface=wlan0
driver=nl80211
ssid=EASY-Demo
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE-ME-BEFORE-NAPLES
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
