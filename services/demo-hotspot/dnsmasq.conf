# Demo hotspot DHCP for EASY, applied only when scripts/demo_hotspot.sh
# enable is run with physical access to the Pi. Not active by default.
# Bound to wlan0 only, so it never interferes with the home network's DHCP.

interface=wlan0
bind-interfaces
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
domain-needed
bogus-priv
