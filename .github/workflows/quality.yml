name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall -q \
            app.py \
            easy_dashboard \
            scripts \
            tests \
            *_manager.py \
            inference_backend.py \
            inference_worker.py \
            frame_provider.py \
            runtime_catalog.py \
            runtime_support.py \
            system_orchestrator.py

      - name: Run unit and integration tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v

      - name: Run dashboard smoke suite
        run: python scripts/smoke_dashboard.py

      - name: Check frontend syntax
        run: |
          for file in static/js/dashboard_*.js; do
            node --check "$file"
          done

      - name: Check shell scripts
        run: bash -n install.sh start.sh preflight_check.sh scripts/*.sh
