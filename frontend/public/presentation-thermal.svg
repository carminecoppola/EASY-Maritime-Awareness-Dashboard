<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">Illustrative thermal maritime reference</title>
  <desc id="description">A clearly labelled synthetic thermal-style maritime scene used only for interface documentation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162d"/>
      <stop offset="0.48" stop-color="#073c68"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08306b"/>
      <stop offset="0.34" stop-color="#0878a6"/>
      <stop offset="0.7" stop-color="#133c7c"/>
      <stop offset="1" stop-color="#081c45"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="0.45" stop-color="#ffe066"/>
      <stop offset="0.72" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ff4444"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="480" fill="url(#background)"/>
  <path d="M0 285 C160 255 270 316 430 282 S730 260 890 292 1110 250 1280 280 V480 H0Z" fill="url(#water)"/>
  <path d="M0 337 C180 305 310 365 500 330 S780 310 960 345 1120 308 1280 332" fill="none" stroke="#00b4d8" stroke-opacity=".34" stroke-width="3"/>
  <ellipse cx="770" cy="244" rx="180" ry="72" fill="#ff8c42" opacity=".22" filter="url(#glow)"/>
  <ellipse cx="770" cy="244" rx="95" ry="34" fill="#ffe066" opacity=".2" filter="url(#glow)"/>
  <path d="M612 269 H905 L866 312 H675Z" fill="#ff8c42" stroke="#ffe066" stroke-width="4"/>
  <path d="M700 206 H828 L870 269 H664Z" fill="#ffd166" stroke="#ff8c42" stroke-width="4"/>
  <path d="M754 164 H784 V206 H754Z" fill="#ff4444"/>
  <path d="M784 176 H850" stroke="#ffe066" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#00e5a0" stroke-width="3">
    <path d="M580 138h42M580 138v42M942 138h-42M942 138v42M580 335h42M580 335v-42M942 335h-42M942 335v-42"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="34" y="30" width="340" height="58" rx="8" fill="#07110e" fill-opacity=".86" stroke="#00b4d8" stroke-opacity=".45"/>
    <text x="54" y="56" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="1">ILLUSTRATIVE THERMAL REFERENCE</text>
    <text x="54" y="76" fill="#a6b7b2" font-size="13">Not a live FLIR measurement</text>
    <rect x="1030" y="34" width="210" height="12" rx="6" fill="url(#heat)"/>
    <text x="1030" y="68" fill="#a6b7b2" font-size="12">relative signal intensity</text>
    <text x="596" y="124" fill="#00e5a0" font-size="13" font-weight="700">MARITIME OBJECT · REFERENCE REGION</text>
    <text x="36" y="445" fill="#ffffff" fill-opacity=".66" font-size="13">EASY Maritime Awareness · presentation preview</text>
  </g>
